<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#1E293B"/>
<title>Vendas de Sites — CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!--
  CRM de venda de sites, LPs e apps (sociedade Esdras + Jehh).

  Mesmo desenho do previmater-crm: arquivo único, sem build, PostgREST
  direto com RLS, roteador por hash. NÃO é cópia do index.html da Prev:
  aquele tem 11.300 linhas presas a ~120 colunas de INSS, GPS e contrato
  judicial. Cortar daria centenas de referências quebradas. Aqui só os
  blocos que se aplicam: login, kanban com arrastar, cartão, chat,
  checklist, inbox, fila e configuração.

  30/10/2026: Caixa de entrada em três colunas, no molde da Prev
  (lista com busca, conversa com resposta, painel do cliente). Lê a view
  sv_lpjehh_vw_inbox (SQL 09 do previmater-ops).

  TABELAS: só sv_lpjehh_*. Nunca crm_*.

  O CRM NÃO ENVIA WHATSAPP. Mensagem escrita aqui vira uma linha
  'manual' em sv_lpjehh_automacoes e quem entrega é o motor, na rodada
  seguinte (no máximo 1 minuto). Mesmo modelo da Prev: um caminho de
  envio só, com as mesmas travas de horário, ritmo e confirmação.
-->
<style>
:root{
  --brand:#2563EB;--brand-d:#1D4ED8;--brand-l:#E8EFFE;
  --bg:#F4F6FA;--white:#FFFFFF;
  --text:#0F172A;--text2:#475569;--text3:#94A3B8;
  --border:#E2E8F0;--border2:#EEF2F7;
  --green:#15803D;--green-bg:#DCFCE7;
  --yellow:#A16207;--yellow-bg:#FEF9C3;
  --red:#B91C1C;--red-bg:#FEE2E2;
  --purple:#6D28D9;--purple-bg:#EDE9FE;
  --r:10px;--rl:14px;--sw:232px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.h{display:none!important}

/* ---------- login ---------- */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
.lg-box{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);padding:28px;width:100%;max-width:360px}
.lg-box h1{font-size:20px;margin-bottom:4px}
.lg-box p{color:var(--text2);margin-bottom:18px;font-size:13px}

/* ---------- formulário ---------- */
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f label{font-size:12px;font-weight:600;color:var(--text2)}
.f input,.f select,.f textarea{border:1px solid var(--border);border-radius:8px;padding:9px 10px;background:var(--white);width:100%}
.f textarea{min-height:80px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--brand-l);border-color:var(--brand)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.g2{grid-template-columns:1fr}}
.btn{border:1px solid var(--border);background:var(--white);border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
/* Interruptor sim/não da Configuração */
.sw{display:inline-flex;align-items:center;gap:10px;border:0;background:none;padding:4px 0;font-weight:600;cursor:pointer}
.sw .tr{width:44px;height:24px;border-radius:12px;background:var(--text3);position:relative;transition:background .15s}
.sw .tr::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on .tr{background:var(--green)}
.sw.on .tr::after{left:23px}
.sw:disabled{opacity:.5;cursor:wait}
.btn.pri:hover{background:var(--brand-d)}
.btn.red{color:var(--red);border-color:#FECACA}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.erro{color:var(--red);font-size:13px;min-height:18px}

/* ---------- layout ---------- */
#app{display:flex;min-height:100%}
#side{width:var(--sw);background:#0F172A;color:#CBD5E1;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:fixed;top:0;bottom:0;left:0}
#side .marca{color:#fff;font-weight:800;font-size:16px;padding:4px 10px 16px}
#side a{color:inherit;text-decoration:none;padding:9px 10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
#side a:hover{background:#1E293B}
#side a.on{background:#1E293B;color:#fff;font-weight:600}
#side .rod{margin-top:auto;font-size:12px;padding:10px;color:#94A3B8}
#side .rod button{background:none;border:none;color:#CBD5E1;text-decoration:underline;padding:0}
.badge{background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
#main{margin-left:var(--sw);flex:1;min-width:0;padding:20px}
#topo{display:none}
@media(max-width:820px){
  #side{transform:translateX(-100%);transition:transform .2s;z-index:50}
  #side.aberto{transform:none}
  #main{margin-left:0;padding:12px}
  #topo{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  #topo button{border:1px solid var(--border);background:var(--white);border-radius:8px;padding:6px 10px}
}
.cab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cab h2{font-size:18px}
.emp{padding:40px;text-align:center;color:var(--text3)}

/* ---------- kanban ---------- */
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;min-height:calc(100vh - 110px)}
.col{background:#EAEEF4;border-radius:var(--rl);width:272px;flex:0 0 272px;display:flex;flex-direction:column;max-height:calc(100vh - 110px)}
.col-h{padding:10px 12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.col-h .pt{width:9px;height:9px;border-radius:50%}
.col-h .qt{margin-left:auto;color:var(--text2);font-weight:600}
.col-b{padding:0 8px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:40px}
.col-b.alvo{background:var(--brand-l);border-radius:10px}
.cd{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:10px;cursor:pointer}
.cd:hover{border-color:var(--brand)}
.cd.arrastando{opacity:.4}
.cd .n{font-weight:700;margin-bottom:2px;word-break:break-word}
.cd .e{color:var(--text2);font-size:12px}
.cd .rod{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.tag{font-size:11px;border-radius:6px;padding:2px 7px;font-weight:600;background:var(--bg);color:var(--text2)}
.tag.prod{background:var(--brand-l);color:var(--brand-d)}
.tag.ok{background:var(--green-bg);color:var(--green)}
.tag.alerta{background:var(--yellow-bg);color:var(--yellow)}
.tag.mal{background:var(--red-bg);color:var(--red)}
.tag.pausa{background:var(--purple-bg);color:var(--purple)}

/* ---------- cartão (modal) ---------- */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;display:flex;justify-content:flex-end}
#mbox{background:var(--bg);width:min(980px,100%);height:100%;overflow:hidden;display:flex;flex-direction:column}
.m-h{background:var(--white);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px}
.m-h h3{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-b{flex:1;overflow:hidden;display:grid;grid-template-columns:1fr 380px}
@media(max-width:820px){.m-b{grid-template-columns:1fr;overflow-y:auto}}
.m-esq{overflow-y:auto;padding:16px}
.m-dir{border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:var(--white)}
@media(max-width:820px){.m-dir{border-left:none;border-top:1px solid var(--border);min-height:520px}}
.sec{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);padding:14px;margin-bottom:12px}
.sec h4{font-size:13px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:#F1F5F9}
.bl{max-width:85%;padding:7px 10px;border-radius:10px;white-space:pre-wrap;word-break:break-word;font-size:13px}
.bl.ent{background:var(--white);border:1px solid var(--border);align-self:flex-start}
.bl.sai{background:#DBEAFE;align-self:flex-end}
.bl.sai.agente{background:#E0E7FF}
.bl .q{display:block;font-size:10px;color:var(--text3);margin-top:3px;text-align:right}
.chat-in{border-top:1px solid var(--border);padding:8px;display:flex;gap:6px;align-items:flex-end}
.chat-in textarea{flex:1;border:1px solid var(--border);border-radius:8px;padding:8px;min-height:40px;max-height:140px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border2)}
.chk:last-child{border-bottom:none}
.chk .tx{flex:1;word-break:break-word}
.chk.feito .tx{text-decoration:line-through;color:var(--text3)}
.chk .mt{font-size:11px;color:var(--text3)}
.lin{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border2);font-size:13px}
.lin:last-child{border-bottom:none}
.mini{font-size:12px;color:var(--text2)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 10px;font-size:13px}
.kv b{color:var(--text2);font-weight:600}

/* ---------- tabelas ---------- */
.tb{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.tr{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border2);align-items:flex-start}
.tr:last-child{border-bottom:none}
.tr.click{cursor:pointer}
.tr.click:hover{background:var(--bg)}
.tr .grow{flex:1;min-width:0}
.tr .prev{color:var(--text2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abas{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.abas button{border:1px solid var(--border);background:var(--white);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px}
.abas button.on{background:var(--text);color:#fff;border-color:var(--text)}
/* ---------- caixa de entrada ---------- */
.ib{display:grid;grid-template-columns:320px 1fr 280px;gap:0;background:var(--white);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;height:calc(100vh - 110px);min-height:420px}
.ib-l{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.ib-bus{padding:10px;border-bottom:1px solid var(--border)}
.ib-bus input{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.ib-bus .abas{margin-bottom:0}
.ib-itens{flex:1;overflow-y:auto}
.ib-it{padding:10px 12px;border-bottom:1px solid var(--border2);cursor:pointer}
.ib-it:hover{background:var(--bg)}
.ib-it.on{background:var(--brand-l)}
.ib-it.esp b::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:middle}
.ib-top{display:flex;justify-content:space-between;gap:8px}
.ib-it .prev{color:var(--text2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 4px}
.ib-tags{display:flex;gap:4px;flex-wrap:wrap}
.ib-c{display:flex;flex-direction:column;min-height:0;min-width:0}
.ib-ch{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}
.ib-ch .grow{flex:1;min-width:0}
.ib-volta{display:none}
.ib-p{border-left:1px solid var(--border);overflow-y:auto;padding:12px;background:var(--bg)}
.ib-p .kv{grid-template-columns:80px 1fr}
.ib-img{max-width:240px;max-height:240px;border-radius:8px;display:block;cursor:pointer;background:var(--border2);min-height:60px}
@media(max-width:900px){
  .ib{grid-template-columns:1fr;height:calc(100vh - 120px)}
  .ib-c,.ib-p{display:none}
  .ib.com-conversa .ib-l{display:none}
  .ib.com-conversa .ib-c{display:flex}
  .ib.com-conversa.com-painel .ib-c{display:none}
  .ib.com-conversa.com-painel .ib-p{display:block}
  .ib-volta{display:inline-block}
}
@media(min-width:901px){#ib-ver-p{display:none}}
/* ---------- agenda (mesmo desenho do Diligências) ---------- */
.ag-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ag-ctl select{border:1px solid var(--border);border-radius:8px;padding:7px 9px;background:var(--white)}
.ag-nav{display:flex;align-items:center;gap:6px}
.ag-nav button{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--white)}
.ag-mes{font-weight:800;min-width:130px;text-align:center}
.ag-leg{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--text2);font-weight:600}
.ag-leg span{display:inline-flex;align-items:center;gap:5px}
.ag-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.ag-sem{font-size:11px;font-weight:700;color:var(--text3);text-align:center;padding:4px 0}
.ag-cel{min-height:62px;border:1px solid var(--border2);border-radius:10px;padding:5px;background:var(--white);cursor:pointer;min-width:0}
.ag-cel:hover{border-color:var(--brand)}
.ag-cel.vazia{background:transparent;border-color:transparent;cursor:default}
.ag-cel.fds{background:#F8FAFC}
.ag-cel.hoje{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.ag-cel.passado .ag-num{color:var(--text3)}
.ag-num{font-size:12px;font-weight:800;color:var(--text2)}
.ag-bdg{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px;align-items:center}
.ag-call{background:var(--brand);color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px}
.ag-cad{color:var(--red);display:inline-flex}
.ag-cad svg,.ag-leg svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
#ag-modal{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
#ag-box{background:var(--bg);border-radius:var(--rl);width:min(560px,100%);max-height:92vh;overflow-y:auto;padding:16px}
.ag-mh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ag-mh h3{flex:1;text-align:center;font-size:15px}
.ag-blq{background:var(--red-bg);color:var(--red);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.ag-blq .grow{flex:1;min-width:0}
.ag-livres{display:flex;gap:6px;flex-wrap:wrap}
.ag-livres button{border:1px solid #BBF7D0;background:var(--green-bg);color:var(--green);border-radius:8px;padding:5px 10px;font-weight:700;font-size:12px}
.ag-livres button.on{background:var(--green);color:#fff}
.st-marcada{background:var(--brand-l);color:var(--brand-d)}
.st-realizada{background:var(--green-bg);color:var(--green)}
.st-cancelada{background:var(--bg);color:var(--text3)}
.st-faltou{background:var(--yellow-bg);color:var(--yellow)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;padding:10px 16px;border-radius:10px;z-index:200;font-size:13px;max-width:90%}
</style>
</head>
<body>

<div id="login" class="h">
  <div class="lg-box">
    <h1>Vendas de Sites</h1>
    <p>Entre com o e-mail e a senha do seu acesso.</p>
    <div class="f"><label>E-mail</label><input id="lg-em" type="email" autocomplete="username"/></div>
    <div class="f"><label>Senha</label><input id="lg-pw" type="password" autocomplete="current-password"/></div>
    <div class="erro" id="lg-err"></div>
    <button class="btn pri" style="width:100%" id="lg-btn">Entrar</button>
  </div>
</div>

<div id="app" class="h">
  <nav id="side">
    <div class="marca">Vendas de Sites</div>
    <a href="#/quadro/comercial" data-nav="comercial">Comercial</a>
    <a href="#/quadro/producao" data-nav="producao">Produção</a>
    <a href="#/inbox" data-nav="inbox">Caixa de entrada <span class="badge h" id="bdg-inbox"></span></a>
    <a href="#/fila" data-nav="fila">Fila <span class="badge h" id="bdg-fila"></span></a>
    <a href="#/agenda" data-nav="agenda">Agenda</a>
    <a href="#/config" data-nav="config" class="so-socio">Configuração</a>
    <div class="rod"><div id="quem"></div><button id="btn-senha">Trocar senha</button> · <button id="btn-sair">Sair</button></div>
  </nav>
  <main id="main">
    <div id="topo"><button id="btn-menu">☰</button><b>Vendas de Sites</b></div>
    <div id="pc"></div>
  </main>
</div>

<div id="modal" class="h"><div id="mbox"></div></div>
<div id="toast" class="h"></div>

<script>
// ============================================================
// CONFIG
// ============================================================
const SUPABASE_URL='https://ggyngtqknonwnohbzkyj.supabase.co';
// Chave anon: é pública por definição. Quem protege os dados é a RLS
// das tabelas sv_lpjehh_* (função sv_lpjehh_ativo / sv_lpjehh_socio).
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdneW5ndHFrbm9ud25vaGJ6a3lqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5ODA4NzcsImV4cCI6MjA5NDU1Njg3N30.0zYn_V9gBtRNWivAHfps6u68akb0mTc7Ix8ZD38OD0I';
// storageKey PRÓPRIA: este app e o CRM da Prev ficam na mesma origem
// (esdraspresidente.github.io) e no mesmo projeto Supabase. Com a chave
// padrão os dois dividiriam a sessão: sair de um derrubaria o outro, e
// entrar com um usuário num trocaria o usuário do outro.
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{storageKey:'sv-lpjehh-auth',persistSession:true}});
const BUCKET='sv-lpjehh-anexos';
const PRODUTOS={lp:'Landing page',site:'Site',app:'App',outro:'Outro'};
const BRIEFING={FALTA_DADO:['Briefing incompleto','alerta'],BRIEFING_OK:['Briefing completo','ok'],FORA_PERFIL:['Fora do perfil','mal']};

let U=null;              // linha do usuário em sv_lpjehh_usuarios
let LISTAS=[];           // todas as listas (os dois quadros)
let USUARIOS=[];         // para o responsável do checklist
let POLL=null;           // atualização do cartão aberto
let POLL_BADGE=null;     // contadores da barra lateral

// ============================================================
// UTILITÁRIOS
// ============================================================
const $=id=>document.getElementById(id);
// TODO texto que vem do banco passa por aqui antes de ir para o HTML.
// Mensagem de cliente é texto livre de estranho: sem isso, um "<img
// onerror=...>" no WhatsApp rodaria script na tela de quem atende.
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg,ms=2800){const t=$('toast');t.textContent=msg;t.classList.remove('h');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.add('h'),ms);}
function dataHora(iso){if(!iso)return '';const d=new Date(iso);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function dataBR(iso){if(!iso)return '';const [a,m,d]=String(iso).slice(0,10).split('-');return d+'/'+m+'/'+a;}
function dinheiro(v){if(v===null||v===undefined||v==='')return '';return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function haQuanto(iso){
  if(!iso)return '';
  const min=Math.floor((Date.now()-new Date(iso).getTime())/60000);
  if(min<60)return min+' min';
  const h=Math.floor(min/60); if(h<24)return h+' h';
  return Math.floor(h/24)+' d';
}
function diasDesde(iso){return iso?(Date.now()-new Date(iso).getTime())/86400000:0;}
function listaPorId(id){return LISTAS.find(l=>l.id===id);}
function falhou(error,oque){if(!error)return false;console.error(oque,error);toast('Erro ao '+oque+': '+error.message,5000);return true;}
function ehSocio(){return U&&U.nivel==='socio';}
function numOuNull(v){if(v===''||v===null||v===undefined)return null;const n=Number(String(v).replace(/\./g,'').replace(',','.'));return Number.isFinite(n)?n:null;}

// ============================================================
// LOGIN
// O cadastro público do Supabase está desligado: só entra quem foi
// convidado E tem linha ativa em sv_lpjehh_usuarios. Login válido sem
// essa linha (ex.: usuário do CRM da Prev) cai em "sem acesso" — a RLS
// já barraria tudo, a tela só diz isso com clareza.
// ============================================================
async function iniciar(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){mostrarLogin();return;}
  const{data,error}=await sb.from('sv_lpjehh_usuarios').select('*').eq('auth_user_id',session.user.id).eq('ativo',true).limit(1);
  if(error||!data||!data.length){
    await sb.auth.signOut();
    mostrarLogin('Este login não tem acesso a este app.');
    return;
  }
  U=data[0];
  $('login').classList.add('h');
  $('app').classList.remove('h');
  $('quem').textContent=U.nome+(ehSocio()?' · sócio':'');
  document.querySelectorAll('.so-socio').forEach(e=>e.classList.toggle('h',!ehSocio()));
  await carregarBase();
  atualizarBadges();
  clearInterval(POLL_BADGE);POLL_BADGE=setInterval(atualizarBadges,30000);
  route();
}
function mostrarLogin(msg){
  $('app').classList.add('h');$('login').classList.remove('h');
  $('lg-err').textContent=msg||'';
}
async function entrar(){
  const em=$('lg-em').value.trim(),pw=$('lg-pw').value;
  if(!em||!pw){$('lg-err').textContent='Preencha e-mail e senha.';return;}
  $('lg-btn').disabled=true;$('lg-err').textContent='';
  const{error}=await sb.auth.signInWithPassword({email:em,password:pw});
  $('lg-btn').disabled=false;
  if(error){$('lg-err').textContent='E-mail ou senha incorretos.';return;}
  iniciar();
}
$('lg-btn').onclick=entrar;
$('lg-pw').addEventListener('keydown',e=>{if(e.key==='Enter')entrar();});
$('btn-sair').onclick=async()=>{await sb.auth.signOut();location.hash='';location.reload();};
// TROCAR SENHA — 30/10/2026. Conta nova nasce com senha temporária
// (workflow auth-criar-usuario do previmater-ops), entregue por mensagem.
// Sem este botão ela ficaria valendo para sempre. Pede a nova duas vezes
// porque não existe "esqueci a senha" aqui: errou a digitação, perdeu o
// acesso. 8 caracteres é o mínimo do Supabase Auth do projeto.
$('btn-senha').onclick=async()=>{
  const nova=prompt('Nova senha (mínimo 8 caracteres):');
  if(nova==null)return;
  if(nova.length<8){toast('A senha precisa ter pelo menos 8 caracteres.');return;}
  if(prompt('Repita a nova senha:')!==nova){toast('As senhas não conferem. Nada foi alterado.');return;}
  const{error}=await sb.auth.updateUser({password:nova});
  if(error){toast('Não consegui trocar: '+error.message,5000);return;}
  toast('Senha trocada.');
};
$('btn-menu').onclick=()=>$('side').classList.toggle('aberto');

async function carregarBase(){
  const[l,u]=await Promise.all([
    sb.from('sv_lpjehh_listas').select('*').eq('arquivada',false).order('quadro').order('ordem'),
    sb.from('sv_lpjehh_usuarios').select('id,nome').eq('ativo',true).order('nome')
  ]);
  if(!falhou(l.error,'carregar listas'))LISTAS=l.data||[];
  // Vendedor só enxerga a própria linha (RLS); nesse caso o responsável
  // do checklist fica restrito a ele mesmo, o que é o comportamento certo.
  if(!u.error)USUARIOS=u.data||[];
}

// ============================================================
// ROTEADOR (mesmo padrão da Prev: hash, uma função page* por rota)
// ============================================================
function marcarNav(n){document.querySelectorAll('#side a').forEach(a=>a.classList.toggle('on',a.dataset.nav===n));$('side').classList.remove('aberto');}
function route(){
  if(!U)return;
  pararInbox(); // a Caixa de entrada atualiza sozinha; fora dela, para
  if($('ag-modal'))agFecharDia(); // modal do dia da Agenda não sobra em outra tela
  const r=(location.hash.slice(1)||'/').split('?')[0];
  if(r==='/'){location.hash='#/quadro/comercial';return;}
  let m;
  if(m=r.match(/^\/quadro\/(comercial|producao)$/))return pageQuadro(m[1]);
  if(m=r.match(/^\/cliente\/([0-9a-f-]{36})$/)){location.replace('#/quadro/comercial');setTimeout(()=>abrirCard(m[1]),0);return;}
  if(r==='/inbox')return pageInbox();
  if(r==='/fila')return pageFila();
  if(r==='/agenda')return pageAgenda();
  if(r==='/config'&&ehSocio())return pageConfig();
  $('pc').innerHTML='<div class="emp">Tela não encontrada</div>';
}
window.addEventListener('hashchange',route);

async function atualizarBadges(){
  const[f,i]=await Promise.all([
    sb.from('sv_lpjehh_automacoes').select('id',{count:'exact',head:true}).eq('status','aguardando_aprovacao').neq('tipo_automacao','aviso_socio'),
    contarEsperando()
  ]);
  const pinta=(id,n)=>{const b=$(id);b.textContent=n;b.classList.toggle('h',!n);};
  pinta('bdg-fila',f.count||0);
  pinta('bdg-inbox',i);
}

// ============================================================
// KANBAN
// Desktop: arrastar e soltar entre colunas. Celular: o arrastar do
// HTML5 não funciona em toque, então lá a troca de lista é pelo seletor
// "Lista" dentro do cartão. Mesma escrita no banco nos dois casos.
// ============================================================
let QUADRO_ATUAL='comercial';
async function pageQuadro(q){
  QUADRO_ATUAL=q;marcarNav(q);
  const listas=LISTAS.filter(l=>l.quadro===q);
  $('pc').innerHTML='<div class="cab"><h2>'+(q==='comercial'?'Comercial':'Produção')+'</h2>'+
    '<div style="display:flex;gap:8px"><input id="kb-busca" placeholder="Buscar nome, empresa, telefone" style="border:1px solid var(--border);border-radius:8px;padding:7px 10px;min-width:220px"/>'+
    '<button class="btn pri" id="kb-novo">+ Novo card</button></div></div><div class="kb" id="kb"><div class="emp">Carregando…</div></div>';
  $('kb-novo').onclick=()=>novoCard(q);
  $('kb-busca').oninput=()=>filtrarKanban($('kb-busca').value);
  const{data,error}=await sb.from('sv_lpjehh_clientes')
    .select('id,nome,empresa,telefone_principal,produto,valor_proposta,valor_fechado,lista_id,posicao,lista_desde,briefing,agente_pausado,escalado_em,prazo_desejado')
    .eq('quadro',q).is('arquivado_em',null).order('posicao').order('criado_em',{ascending:false}).limit(1000);
  if(falhou(error,'carregar o quadro'))return;
  const porLista={};listas.forEach(l=>porLista[l.id]=[]);
  const semLista=[];
  (data||[]).forEach(c=>{(porLista[c.lista_id]||semLista).push(c);});
  // Card sem lista (ex.: lista apagada) vai para a primeira coluna, para
  // não sumir da tela. Ele aparece, e mover salva a lista certa.
  if(semLista.length&&listas[0])porLista[listas[0].id]=semLista.concat(porLista[listas[0].id]);
  $('kb').innerHTML=listas.map(l=>{
    const cards=porLista[l.id];
    return '<div class="col"><div class="col-h"><span class="pt" style="background:'+esc(l.cor)+'"></span>'+esc(l.nome)+'<span class="qt">'+cards.length+'</span></div>'+
      '<div class="col-b" data-lista="'+l.id+'">'+cards.map(c=>cardHtml(c,l)).join('')+'</div></div>';
  }).join('')||'<div class="emp">Nenhuma lista neste quadro.</div>';
  ligarArrastar();
}
function cardHtml(c,l){
  const tags=[];
  if(c.produto)tags.push('<span class="tag prod">'+esc(PRODUTOS[c.produto]||c.produto)+'</span>');
  const v=c.valor_fechado??c.valor_proposta;
  if(v)tags.push('<span class="tag">'+dinheiro(v)+'</span>');
  if(c.briefing&&BRIEFING[c.briefing])tags.push('<span class="tag '+BRIEFING[c.briefing][1]+'">'+BRIEFING[c.briefing][0]+'</span>');
  if(c.agente_pausado)tags.push('<span class="tag pausa">Agente pausado</span>');
  if(c.escalado_em)tags.push('<span class="tag mal">Pediu humano</span>');
  // Parado demais na lista: abandono_dias vem da própria lista, editável
  // no banco sem deploy.
  const parado=l&&l.abandono_dias&&diasDesde(c.lista_desde)>l.abandono_dias;
  tags.push('<span class="tag'+(parado?' alerta':'')+'" title="Tempo nesta lista">'+haQuanto(c.lista_desde)+'</span>');
  const busca=[c.nome,c.empresa,c.telefone_principal].join(' ').toLowerCase();
  return '<div class="cd" draggable="true" data-id="'+c.id+'" data-busca="'+esc(busca)+'">'+
    '<div class="n">'+esc(c.nome||'Sem nome')+'</div>'+
    (c.empresa?'<div class="e">'+esc(c.empresa)+'</div>':'')+
    '<div class="rod">'+tags.join('')+'</div></div>';
}
function filtrarKanban(t){
  t=t.trim().toLowerCase();
  document.querySelectorAll('#kb .cd').forEach(el=>el.classList.toggle('h',!!t&&!el.dataset.busca.includes(t)));
}
function ligarArrastar(){
  let arrastado=null;
  document.querySelectorAll('#kb .cd').forEach(el=>{
    el.onclick=()=>abrirCard(el.dataset.id);
    el.ondragstart=e=>{arrastado=el;el.classList.add('arrastando');e.dataTransfer.effectAllowed='move';};
    el.ondragend=()=>{el.classList.remove('arrastando');document.querySelectorAll('.col-b').forEach(c=>c.classList.remove('alvo'));};
  });
  document.querySelectorAll('#kb .col-b').forEach(col=>{
    col.ondragover=e=>{e.preventDefault();col.classList.add('alvo');};
    col.ondragleave=()=>col.classList.remove('alvo');
    col.ondrop=async e=>{
      e.preventDefault();col.classList.remove('alvo');
      if(!arrastado)return;
      const depois=[...col.querySelectorAll('.cd:not(.arrastando)')].find(c=>{const r=c.getBoundingClientRect();return e.clientY<r.top+r.height/2;});
      col.insertBefore(arrastado,depois||null);
      await salvarPosicoes(col,arrastado.dataset.id);
    };
  });
}
// Regrava posição de TODOS os cards da coluna destino. Simples e
// correto para colunas de dezenas de cards; o gatilho do banco cuida de
// lista_desde e do histórico quando a lista muda.
async function salvarPosicoes(col,movidoId){
  const listaId=col.dataset.lista;
  const ids=[...col.querySelectorAll('.cd')].map(c=>c.dataset.id);
  const r=await sb.from('sv_lpjehh_clientes').update({lista_id:listaId,posicao:ids.indexOf(movidoId)}).eq('id',movidoId);
  if(falhou(r.error,'mover o card')){pageQuadro(QUADRO_ATUAL);return;}
  await Promise.all(ids.map((id,i)=>id===movidoId?null:sb.from('sv_lpjehh_clientes').update({posicao:i}).eq('id',id)));
  // Recarrega para atualizar contadores e o "tempo nesta lista".
  pageQuadro(QUADRO_ATUAL);
}
async function novoCard(q){
  const nome=prompt('Nome do cliente:');
  if(!nome||!nome.trim())return;
  const tel=prompt('WhatsApp com DDD (opcional):')||'';
  const dig=tel.replace(/\D/g,'');
  // Mesma chave do webhook (DDD + 8 últimos dígitos). Se divergir, a
  // primeira mensagem desse cliente criaria um segundo card.
  let chave=null;
  if(dig){let d=dig;if((d.length===12||d.length===13)&&d.startsWith('55'))d=d.slice(2);if(d.length>=10)chave=d.slice(0,2)+d.slice(-8);}
  const primeira=LISTAS.find(l=>l.quadro===q);
  const{data,error}=await sb.from('sv_lpjehh_clientes').insert({nome:nome.trim(),telefone_principal:dig||null,telefone_chave:chave,quadro:q,lista_id:primeira?.id||null,origem:'manual'}).select('id').limit(1);
  if(error&&error.code==='23505'){toast('Já existe um card com esse telefone.',4000);return;}
  if(falhou(error,'criar o card'))return;
  await pageQuadro(q);
  abrirCard(data[0].id);
}

// ============================================================
// CARTÃO
// Esquerda: dados, briefing, checklist, anexos, histórico.
// Direita: conversa do WhatsApp (atualiza a cada 10 s enquanto aberto).
// ============================================================
let CARD=null;
async function abrirCard(id){
  const{data,error}=await sb.from('sv_lpjehh_clientes').select('*').eq('id',id).limit(1);
  if(falhou(error,'abrir o card'))return;
  if(!data||!data.length){toast('Card não encontrado.');return;}
  CARD=data[0];
  $('modal').classList.remove('h');
  desenharCard();
  carregarChat();carregarChecklist();carregarAnexos();carregarAtividades();carregarEtiquetas();
  clearInterval(POLL);POLL=setInterval(carregarChat,10000);
}
function fecharCard(){
  // Fechar com alteração não salva perderia o que foi digitado em
  // silêncio. Pergunta antes.
  if(cardAlterado()&&!confirm('Há alterações não salvas. Fechar mesmo assim?'))return;
  clearInterval(POLL);POLL=null;CARD=null;
  $('modal').classList.add('h');$('mbox').innerHTML='';
  if(location.hash.startsWith('#/quadro/'))pageQuadro(QUADRO_ATUAL);
}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')fecharCard();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').classList.contains('h'))fecharCard();});

const CAMPOS=['nome','empresa','segmento','cidade','email','telefone_principal','produto','valor_proposta','valor_fechado','prazo_desejado','observacoes'];
function valorCampo(k){const el=$('c-'+k);return el?el.value:'';}
function cardAlterado(){
  if(!CARD)return false;
  return CAMPOS.some(k=>{
    const atual=valorCampo(k),orig=CARD[k];
    if(k.startsWith('valor_'))return numOuNull(atual)!==(orig===null?null:Number(orig));
    return (atual||'')!==(orig==null?'':String(orig));
  });
}
function desenharCard(){
  const c=CARD;
  const listasDoQuadro=LISTAS.filter(l=>l.quadro===c.quadro);
  const opcLista=listasDoQuadro.map(l=>'<option value="'+l.id+'"'+(l.id===c.lista_id?' selected':'')+'>'+esc(l.nome)+'</option>').join('');
  const opcProd='<option value="">—</option>'+Object.entries(PRODUTOS).map(([k,v])=>'<option value="'+k+'"'+(c.produto===k?' selected':'')+'>'+v+'</option>').join('');
  const fone=String(c.telefone_principal||'').replace(/\D/g,'');
  $('mbox').innerHTML=
  '<div class="m-h"><h3>'+esc(c.nome||'Sem nome')+'</h3>'+
    (fone?'<a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/'+(fone.length<=11?'55':'')+fone+'">WhatsApp</a>':'')+
    '<button class="btn sm" id="m-fechar">Fechar</button></div>'+
  '<div class="m-b"><div class="m-esq">'+
    '<div class="sec"><h4>Situação</h4><div class="g2">'+
      '<div class="f"><label>Quadro</label><select id="c-quadro"><option value="comercial"'+(c.quadro==='comercial'?' selected':'')+'>Comercial</option><option value="producao"'+(c.quadro==='producao'?' selected':'')+'>Produção</option></select></div>'+
      '<div class="f"><label>Lista</label><select id="c-lista">'+opcLista+'</select></div></div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
        '<button class="btn sm" id="c-agente">'+(c.agente_pausado?'▶ Retomar agente':'⏸ Pausar agente')+'</button>'+
        (c.escalado_em?'<button class="btn sm" id="c-escalado">Marcar pedido de humano como resolvido</button>':'')+
        '<button class="btn sm red" id="c-arquivar">'+(c.arquivado_em?'Desarquivar':'Arquivar')+'</button>'+
      '</div>'+
      '<div id="c-etq" style="margin-top:10px"></div>'+
    '</div>'+
    '<div class="sec"><h4>Dados <button class="btn sm pri" id="c-salvar">Salvar</button></h4>'+
      '<div class="g2">'+
        campo('nome','Nome',c.nome)+campo('empresa','Empresa',c.empresa)+
        campo('segmento','Segmento',c.segmento)+campo('cidade','Cidade',c.cidade)+
        campo('telefone_principal','WhatsApp',c.telefone_principal)+campo('email','E-mail',c.email,'email')+
        '<div class="f"><label>Produto</label><select id="c-produto">'+opcProd+'</select></div>'+
        campo('prazo_desejado','Prazo desejado',c.prazo_desejado,'date')+
        campo('valor_proposta','Valor da proposta',c.valor_proposta)+campo('valor_fechado','Valor fechado',c.valor_fechado)+
      '</div>'+
      '<div class="f"><label>Observações</label><textarea id="c-observacoes">'+esc(c.observacoes)+'</textarea></div>'+
    '</div>'+
    briefingHtml(c)+
    '<div class="sec"><h4>Checklist</h4><div id="c-chk"></div>'+
      '<div style="display:flex;gap:6px;margin-top:8px"><input id="c-chk-novo" placeholder="Novo item (ex.: layout aprovado)" style="flex:1;border:1px solid var(--border);border-radius:8px;padding:7px 10px"/><button class="btn sm" id="c-chk-add">Adicionar</button></div></div>'+
    '<div class="sec"><h4>Anexos <label class="btn sm">Enviar arquivo<input type="file" id="c-up" class="h"/></label></h4><div id="c-anx"></div></div>'+
    '<div class="sec"><h4>Histórico</h4><div id="c-ativ"></div></div>'+
  '</div>'+
  '<div class="m-dir"><div class="chat" id="c-chat"><div class="emp">Carregando…</div></div>'+
    '<div class="chat-in"><textarea id="c-msg" placeholder="Mensagem para o cliente (sai pelo motor em até 1 min)"></textarea><button class="btn pri" id="c-enviar">Enviar</button></div>'+
  '</div></div>';
  $('m-fechar').onclick=fecharCard;
  $('c-salvar').onclick=salvarCard;
  $('c-lista').onchange=()=>mudarLista($('c-lista').value);
  $('c-quadro').onchange=()=>mudarQuadro($('c-quadro').value);
  $('c-agente').onclick=togAgente;
  if($('c-escalado'))$('c-escalado').onclick=resolverEscalado;
  $('c-arquivar').onclick=togArquivar;
  $('c-chk-add').onclick=addChecklist;
  $('c-chk-novo').addEventListener('keydown',e=>{if(e.key==='Enter')addChecklist();});
  $('c-up').onchange=enviarAnexo;
  $('c-enviar').onclick=enviarMensagem;
}
function campo(k,rot,v,tipo){
  return '<div class="f"><label>'+rot+'</label><input id="c-'+k+'" type="'+(tipo||'text')+'" value="'+esc(v)+'"/></div>';
}
// O briefing é preenchido pelo agente (agente_dados) e julgado por
// regra no motor (coluna briefing). Aqui só se mostra: editar o que o
// agente coletou sem passar pela regra deixaria o status mentindo.
function briefingHtml(c){
  const d=c.agente_dados||{};
  const chaves=Object.keys(d);
  const st=c.briefing&&BRIEFING[c.briefing]?'<span class="tag '+BRIEFING[c.briefing][1]+'">'+BRIEFING[c.briefing][0]+'</span>':'<span class="tag">Sem avaliação</span>';
  return '<div class="sec"><h4>Briefing coletado pelo agente '+st+'</h4>'+
    (chaves.length?'<div class="kv">'+chaves.map(k=>'<b>'+esc(k.replace(/_/g,' '))+'</b><span>'+esc(typeof d[k]==='object'?JSON.stringify(d[k]):d[k])+'</span>').join('')+'</div>'
      :'<div class="mini">Nada coletado ainda.</div>')+'</div>';
}
async function salvarCard(){
  const up={};
  CAMPOS.forEach(k=>{
    let v=valorCampo(k);
    if(k.startsWith('valor_'))v=numOuNull(v);
    else v=(v||'').trim()||null;
    up[k]=v;
  });
  if(!up.nome){toast('O nome não pode ficar vazio.');return;}
  // Telefone mudou → recalcula a chave, senão a próxima mensagem do
  // cliente cria outro card.
  if(up.telefone_principal!==CARD.telefone_principal){
    let d=String(up.telefone_principal||'').replace(/\D/g,'');
    if((d.length===12||d.length===13)&&d.startsWith('55'))d=d.slice(2);
    up.telefone_chave=d.length>=10?d.slice(0,2)+d.slice(-8):null;
  }
  $('c-salvar').disabled=true;
  const{data,error}=await sb.from('sv_lpjehh_clientes').update(up).eq('id',CARD.id).select('*').limit(1);
  $('c-salvar').disabled=false;
  if(error&&error.code==='23505'){toast('Outro card já usa esse telefone.',4000);return;}
  if(falhou(error,'salvar'))return;
  CARD=data[0];
  $('mbox').querySelector('.m-h h3').textContent=CARD.nome;
  toast('Salvo.');
}
async function mudarLista(listaId){
  const{data,error}=await sb.from('sv_lpjehh_clientes').update({lista_id:listaId,posicao:0}).eq('id',CARD.id).select('*').limit(1);
  if(falhou(error,'mudar de lista'))return;
  CARD=data[0];carregarAtividades();toast('Movido para '+(listaPorId(listaId)?.nome||'a lista'));
}
async function mudarQuadro(q){
  // Mudar de quadro leva o card para a primeira lista do outro quadro
  // (ex.: Fechado → Produção / A iniciar).
  const primeira=LISTAS.find(l=>l.quadro===q);
  const{data,error}=await sb.from('sv_lpjehh_clientes').update({quadro:q,lista_id:primeira?.id||null,posicao:0}).eq('id',CARD.id).select('*').limit(1);
  if(falhou(error,'mudar de quadro'))return;
  CARD=data[0];desenharCard();carregarChat();carregarChecklist();carregarAnexos();carregarAtividades();carregarEtiquetas();
}
async function togAgente(){
  const novo=!CARD.agente_pausado;
  const{error}=await sb.from('sv_lpjehh_clientes').update({agente_pausado:novo}).eq('id',CARD.id);
  if(falhou(error,'mudar o agente'))return;
  CARD.agente_pausado=novo;
  await registrar(novo?'Agente pausado por '+U.nome+'.':'Agente retomado por '+U.nome+'.');
  $('c-agente').textContent=novo?'▶ Retomar agente':'⏸ Pausar agente';
}
async function resolverEscalado(){

// ---------- chat ----------
let CHAT_ULTIMO='';
async function carregarChat(){
  if(!CARD)return;
  const id=CARD.id;
  const[m,a]=await Promise.all([
    sb.from('sv_lpjehh_mensagens').select('id,direcao,autor_tipo,tipo,texto,midia_caminho,midia_nome,enviada_em,criado_em,status').eq('cliente_id',id).order('enviada_em',{ascending:false,nullsFirst:false}).limit(200),
    // O que ainda está na fila aparece no fim da conversa, apagado, para
    // quem atende saber que já tem mensagem saindo e não mandar outra.
    sb.from('sv_lpjehh_automacoes').select('id,tipo_automacao,texto_montado,status,data_hora_agendada').eq('cliente_id',id).in('status',['agendado','enviando','aguardando_aprovacao','erro']).neq('tipo_automacao','aviso_socio').order('data_hora_agendada')
  ]);
  if(!CARD||CARD.id!==id||!$('c-chat'))return;
  if(m.error){$('c-chat').innerHTML='<div class="emp">Erro ao carregar a conversa.</div>';return;}
  const msgs=(m.data||[]).reverse();
  const assinatura=msgs.map(x=>x.id).join()+'|'+(a.data||[]).map(x=>x.id+x.status).join();
  if(assinatura===CHAT_ULTIMO)return; // nada mudou: não redesenha nem rola a tela
  CHAT_ULTIMO=assinatura;
  const el=$('c-chat');
  const noFim=el.scrollHeight-el.scrollTop-el.clientHeight<60;
  el.innerHTML=(msgs.length?msgs.map(bolha).join(''):'<div class="emp">Sem mensagens ainda.</div>')+
    (a.data||[]).map(x=>'<div class="bl sai" style="opacity:.6;border:1px dashed var(--text3)">'+esc(String(x.texto_montado||'').replace(/ \/ /g,'\n'))+
      '<span class="q">'+({agendado:'na fila',enviando:'enviando',aguardando_aprovacao:'aguardando aprovação',erro:'ERRO no envio'}[x.status]||x.status)+' · '+dataHora(x.data_hora_agendada)+'</span></div>').join('');
  if(noFim)el.scrollTop=el.scrollHeight;
  el.querySelectorAll('[data-midia]').forEach(b=>b.onclick=()=>abrirArquivo(b.dataset.midia));
}
function bolha(x){
  const sai=x.direcao==='saida';
  const quem={cliente:'',agente:'agente',humano:'humano',sistema:'sistema'}[x.autor_tipo]??'';
  let corpo=x.texto?esc(x.texto):'';
  if(x.midia_caminho)corpo+=(corpo?'\n':'')+'<button class="btn sm" data-midia="'+esc(x.midia_caminho)+'">📎 '+esc(x.midia_nome||x.tipo)+'</button>';
  else if(!x.texto)corpo='<i>['+esc(x.tipo)+']</i>';
  return '<div class="bl '+(sai?'sai':'ent')+(x.autor_tipo==='agente'?' agente':'')+'">'+corpo+
    '<span class="q">'+(quem?quem+' · ':'')+dataHora(x.enviada_em||x.criado_em)+'</span></div>';
}
async function enviarMensagem(){
  const t=$('c-msg').value.trim();
  if(!t)return;
  if(!CARD.telefone_chave){toast('Este card não tem WhatsApp cadastrado.');return;}
  $('c-enviar').disabled=true;
  // 'manual' entra na fila já aprovado: quem escreveu é humano.
  // O motor entrega na próxima rodada.
  const{error}=await sb.from('sv_lpjehh_automacoes').insert({
    cliente_id:CARD.id,tipo_automacao:'manual',status:'agendado',aprovado:true,aprovado_por:U.id,aprovado_em:new Date().toISOString(),
    data_hora_agendada:new Date().toISOString(),texto_montado:t,ordem:1
  });
  $('c-enviar').disabled=false;
  if(falhou(error,'enviar'))return;
  $('c-msg').value='';CHAT_ULTIMO='';carregarChat();
  toast('Na fila. Sai em até 1 minuto.');
}

// ============================================================
// CAIXA DE ENTRADA — 30/10/2026, no molde da Prev
// Três colunas: conversas (com busca), a conversa aberta com resposta,
// e o painel do cliente. Atualiza sozinha: lista a cada 20 s, conversa
// aberta a cada 8 s.
//
// A LISTA VEM DA VIEW sv_lpjehh_vw_inbox (SQL 09), uma linha por
// conversa com prévia de 200 caracteres. A versão anterior puxava as 500
// últimas mensagens e agrupava aqui; na Prev esse desenho chegou a 12 MB
// por carga e estourou a cota de banda.
//
// RESPONDER usa o MESMO caminho do chat do cartão: linha "manual" na
// fila, aprovada, que o motor entrega no próximo minuto. Não existe um
// segundo jeito de mandar mensagem.
//
// No celular (< 900 px) é uma coluna por vez: lista → conversa → painel,
// com botão de voltar.
// ============================================================
let IB={lista:[],sel:null,filtro:'esperando',busca:'',tLista:null,tChat:null,assinatura:'',urls:new Map()};
function pararInbox(){clearInterval(IB.tLista);clearInterval(IB.tChat);IB.tLista=IB.tChat=null;}
async function carregarInboxLista(){
  const{data,error}=await sb.from('sv_lpjehh_vw_inbox').select('*').order('quando',{ascending:false}).limit(300);

async function contarEsperando(){

function prevTexto(c){
  const midia={imagem:'📷 Imagem',audio:'🎤 Áudio',video:'🎬 Vídeo',documento:'📎 Arquivo',figurinha:'Figurinha'}[c.tipo];
  const t=c.previa||midia||'['+(c.tipo||'mensagem')+']';
  const quem=c.direcao==='saida'?(c.autor_tipo==='agente'?'Vanessa: ':'Você: '):'';

}
async function pageInbox(){
  marcarNav('inbox');pararInbox();
  IB.sel=null;IB.assinatura='';
  $('pc').innerHTML=
    '<div class="cab"><h2>Caixa de entrada</h2></div>'+
    '<div class="ib" id="ib">'+
      '<div class="ib-l"><div class="ib-bus"><input id="ib-busca" placeholder="Buscar por nome, empresa ou final do telefone"/>'+
        '<div class="abas"><button data-f="esperando" class="on">Esperando</button><button data-f="todas">Todas</button></div></div>'+
        '<div id="ib-itens" class="ib-itens"><div class="emp">Carregando…</div></div></div>'+
      '<div class="ib-c" id="ib-c"><div class="emp" style="margin:auto">Selecione uma conversa</div></div>'+
      '<div class="ib-p" id="ib-p"></div>'+

  await atualizarInboxLista();
  IB.tLista=setInterval(atualizarInboxLista,20000);

async function atualizarInboxLista(){
  if(!$('ib-itens'))return pararInbox();
  const l=await carregarInboxLista();
  if(!l){if(!IB.lista.length)$('ib-itens').innerHTML='<div class="emp">Erro ao carregar.</div>';return;}
  IB.lista=l;desenharInboxLista();
}
function desenharInboxLista(){
  const el=$('ib-itens');if(!el)return;
  const q=IB.busca.trim().toLowerCase();
  const itens=IB.lista.filter(c=>IB.filtro==='todas'||c.direcao==='entrada').filter(c=>!q||[c.nome,c.empresa,c.fone_final].some(v=>String(v||'').toLowerCase().includes(q)));
  el.innerHTML=itens.length?itens.map(c=>{
    const l=listaPorId(c.lista_id);
    return '<div class="ib-it'+(c.cliente_id===IB.sel?' on':'')+(c.direcao==='entrada'?' esp':'')+'" data-id="'+c.cliente_id+'">'+
      '<div class="ib-top"><b>'+esc(c.nome||'Sem nome')+'</b><span class="mini">'+haQuanto(c.quando)+'</span></div>'+
      '<div class="prev">'+esc(prevTexto(c))+'</div>'+
      '<div class="ib-tags">'+(l?'<span class="tag">'+esc(l.nome)+'</span>':'')+(c.produto?'<span class="tag prod">'+esc(PRODUTOS[c.produto]||c.produto)+'</span>':'')+
        (c.escalado_em?'<span class="tag mal">pediu humano</span>':'')+(c.agente_pausado?'<span class="tag pausa">Vanessa pausada</span>':'')+'</div></div>';
  }).join(''):'<div class="emp">'+(IB.filtro==='esperando'?'Ninguém esperando resposta.':'Nenhuma conversa.')+'</div>';
  el.querySelectorAll('[data-id]').forEach(d=>d.onclick=()=>abrirConversa(d.dataset.id));
}
async function abrirConversa(id){
  IB.sel=id;IB.assinatura='';
  desenharInboxLista();
  $('ib').classList.add('com-conversa');
  $('ib-c').innerHTML=
    '<div class="ib-ch"><button class="btn sm ib-volta" id="ib-volta">←</button><div class="grow" id="ib-nome"><b>…</b></div><button class="btn sm" id="ib-ver-p">Painel</button></div>'+
    '<div class="chat" id="ib-chat"><div class="emp">Carregando…</div></div>'+
    '<div class="chat-in"><textarea id="ib-msg" placeholder="Responder (sai pelo WhatsApp em até 1 minuto)"></textarea><button class="btn pri" id="ib-env">Enviar</button></div>';
  $('ib-volta').onclick=()=>{$('ib').classList.remove('com-conversa','com-painel');IB.sel=null;clearInterval(IB.tChat);desenharInboxLista();};
  $('ib-ver-p').onclick=()=>$('ib').classList.toggle('com-painel');
  $('ib-env').onclick=()=>enviarInbox();
  $('ib-msg').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))enviarInbox();});
  await desenharPainelInbox();
  await carregarConversaInbox(true);
  clearInterval(IB.tChat);IB.tChat=setInterval(()=>carregarConversaInbox(false),8000);
}
async function carregarConversaInbox(rolar){
  const id=IB.sel;if(!id||!$('ib-chat'))return clearInterval(IB.tChat);
  const[m,a]=await Promise.all([
    sb.from('sv_lpjehh_mensagens').select('id,direcao,autor_tipo,tipo,texto,midia_caminho,midia_nome,midia_mime,midia_transcricao,midia_tipo_doc,enviada_em,criado_em').eq('cliente_id',id).order('enviada_em',{ascending:false,nullsFirst:false}).limit(150),
    sb.from('sv_lpjehh_automacoes').select('id,tipo_automacao,texto_montado,status,data_hora_agendada').eq('cliente_id',id).in('status',['agendado','enviando','aguardando_aprovacao','erro']).not('tipo_automacao','in','(aviso_socio,contrato_conferir)').order('data_hora_agendada')
  ]);
  if(IB.sel!==id||!$('ib-chat'))return;
  if(m.error){$('ib-chat').innerHTML='<div class="emp">Erro ao carregar a conversa.</div>';return;}
  const msgs=(m.data||[]).reverse();
  const assinatura=msgs.map(x=>x.id).join()+'|'+(a.data||[]).map(x=>x.id+x.status).join();
  if(assinatura===IB.assinatura)return; // nada mudou: não redesenha nem pula a rolagem
  IB.assinatura=assinatura;
  const el=$('ib-chat');
  const noFim=rolar||el.scrollHeight-el.scrollTop-el.clientHeight<60;
  el.innerHTML=(msgs.length?msgs.map(bolhaInbox).join(''):'<div class="emp">Sem mensagens ainda.</div>')+
    (a.data||[]).map(x=>'<div class="bl sai" style="opacity:.6;border:1px dashed var(--text3)">'+esc(String(x.texto_montado||'').replace(/ \/ /g,'\n'))+
      '<span class="q">'+({agendado:'na fila',enviando:'enviando',aguardando_aprovacao:'aguardando aprovação',erro:'ERRO no envio'}[x.status]||x.status)+' · '+dataHora(x.data_hora_agendada)+'</span></div>').join('');
  el.querySelectorAll('[data-midia]').forEach(b=>b.onclick=()=>abrirArquivo(b.dataset.midia));
  await mostrarImagensInbox(el);
  if(noFim)el.scrollTop=el.scrollHeight;
}
/* Mesma bolha do cartão, com duas diferenças: imagem aparece na conversa
   (URL assinada de 1 h, guardada para não pedir de novo a cada 8 s) e
   áudio transcrito mostra o texto. Documento de identidade NÃO é aberto
   na conversa: aparece só o rótulo, e abre com um clique, como no cartão. */
function bolhaInbox(x){
  const sai=x.direcao==='saida';
  const quem={cliente:'',agente:'Vanessa',humano:'humano',sistema:'sistema'}[x.autor_tipo]??'';
  let corpo='';
  const ehDoc=['rg','cnh','cin'].includes(x.midia_tipo_doc);
  if(x.midia_caminho&&x.tipo==='imagem'&&!ehDoc)corpo+='<img class="ib-img" data-img="'+esc(x.midia_caminho)+'" data-midia="'+esc(x.midia_caminho)+'" alt="imagem"/>';
  else if(x.midia_caminho)corpo+='<button class="btn sm" data-midia="'+esc(x.midia_caminho)+'">📎 '+esc(ehDoc?'Documento de identidade':(x.midia_nome||x.tipo))+'</button>';
  if(x.tipo==='audio'&&x.midia_transcricao)corpo+=(corpo?'\n':'')+'<i>🎤 '+esc(x.midia_transcricao)+'</i>';
  if(x.texto)corpo+=(corpo?'\n':'')+esc(x.texto);
  if(!corpo)corpo='<i>['+esc(x.tipo)+']</i>';
  return '<div class="bl '+(sai?'sai':'ent')+(x.autor_tipo==='agente'?' agente':'')+'">'+corpo+
    '<span class="q">'+(quem?quem+' · ':'')+dataHora(x.enviada_em||x.criado_em)+'</span></div>';
}
async function mostrarImagensInbox(el){
  const faltam=[...new Set([...el.querySelectorAll('img[data-img]')].map(i=>i.dataset.img).filter(p=>!IB.urls.has(p)))];
  if(faltam.length){
    const{data}=await sb.storage.from(BUCKET).createSignedUrls(faltam,3600);
    (data||[]).forEach(d=>{if(d.signedUrl)IB.urls.set(d.path,d.signedUrl);});
  }
  el.querySelectorAll('img[data-img]').forEach(i=>{const u=IB.urls.get(i.dataset.img);if(u)i.src=u;});
}
async function desenharPainelInbox(){
  const id=IB.sel;
  const{data,error}=await sb.from('sv_lpjehh_clientes').select('id,nome,empresa,telefone_chave,produto,valor_proposta,valor_fechado,lista_id,agente_pausado,escalado_em,agente_dados,proposta_enviada_em,fechado_em,material_completo_em').eq('id',id).limit(1);
  if(IB.sel!==id)return;
  if(error||!data?.length){$('ib-p').innerHTML='<div class="emp">Card não encontrado.</div>';return;}
  const c=data[0],d=c.agente_dados||{},l=listaPorId(c.lista_id);
  $('ib-nome').innerHTML='<b>'+esc(c.nome||'Sem nome')+'</b>'+(c.empresa?' <span class="mini">· '+esc(c.empresa)+'</span>':'');
  const linha=(k,v)=>v?'<b>'+k+'</b><span>'+esc(v)+'</span>':'';
  $('ib-p').innerHTML=
    '<button class="btn sm ib-volta" id="ib-volta-p" style="margin-bottom:10px">← Conversa</button>'+
    '<div class="sec"><h4>'+esc(c.nome||'Sem nome')+'</h4><div class="kv">'+
      linha('Etapa',l?(l.quadro==='producao'?'Produção · ':'')+l.nome:'')+
      linha('Produto',PRODUTOS[c.produto||d.produto]||'')+
      linha('Proposta',dinheiro(c.valor_proposta))+
      linha('Fechado',dinheiro(c.valor_fechado))+
      linha('Negócio',d.negocio)+linha('Objetivo',d.objetivo)+
      linha('WhatsApp',c.telefone_chave?'final '+String(c.telefone_chave).slice(-4):'')+
    '</div></div>'+
    (c.escalado_em?'<div class="sec" style="border-color:#FECACA"><b style="color:var(--red)">Pediu atendimento humano</b><div class="mini">'+dataHora(c.escalado_em)+'</div><button class="btn sm" id="ib-resolver" style="margin-top:8px">Marcar como resolvido</button></div>':'')+
    '<div class="sec"><button class="btn" id="ib-agente" style="width:100%;margin-bottom:8px">'+(c.agente_pausado?'▶ Retomar Vanessa':'⏸ Pausar Vanessa')+'</button>'+
      '<button class="btn pri" id="ib-card" style="width:100%">Abrir card completo</button></div>';
  $('ib-card').onclick=()=>abrirCard(c.id);
  $('ib-volta-p').onclick=()=>$('ib').classList.remove('com-painel');
  $('ib-agente').onclick=async()=>{
    const novo=!c.agente_pausado;
    // Pausar também tira da fila a fala da Vanessa que ainda não saiu:
    // senão uma resposta já pronta sairia minutos depois de você assumir
    // (lição da Prev, 02/09). Mensagem manual e aviso ficam.
    const{error}=await sb.from('sv_lpjehh_clientes').update({agente_pausado:novo}).eq('id',c.id);
    if(falhou(error,'mudar a Vanessa'))return;
    if(novo)await sb.from('sv_lpjehh_automacoes').update({status:'cancelado',motivo_cancelamento:'Vanessa pausada na Caixa de entrada'}).eq('cliente_id',c.id).in('status',['agendado','aguardando_aprovacao']).in('tipo_automacao',['agente','abertura','sequencia']);
    await sb.from('sv_lpjehh_atividades').insert({cliente_id:c.id,usuario_id:U.id,tipo:'nota',descricao:(novo?'Vanessa pausada':'Vanessa retomada')+' por '+U.nome+' (Caixa de entrada).'});
    toast(novo?'Vanessa pausada nesta conversa.':'Vanessa retomada.');
    desenharPainelInbox();atualizarInboxLista();IB.assinatura='';carregarConversaInbox(false);
  };
  if($('ib-resolver'))$('ib-resolver').onclick=async()=>{
    const{error}=await sb.from('sv_lpjehh_clientes').update({escalado_em:null}).eq('id',c.id);
    if(falhou(error,'resolver'))return;
    await sb.from('sv_lpjehh_atividades').insert({cliente_id:c.id,usuario_id:U.id,tipo:'nota',descricao:'Pedido de atendimento humano resolvido por '+U.nome+'.'});
    desenharPainelInbox();atualizarInboxLista();
  };
}
async function enviarInbox(){
  const t=$('ib-msg').value.trim();
  if(!t||!IB.sel)return;
  $('ib-env').disabled=true;
  // Mesmo insert do chat do cartão: 'manual' já aprovada; o motor entrega.
  const{error}=await sb.from('sv_lpjehh_automacoes').insert({
    cliente_id:IB.sel,tipo_automacao:'manual',status:'agendado',aprovado:true,aprovado_por:U.id,aprovado_em:new Date().toISOString(),
    data_hora_agendada:new Date().toISOString(),texto_montado:t,ordem:1
  });

  $('ib-msg').value='';IB.assinatura='';carregarConversaInbox(true);

}

// ============================================================
// CONFIGURAÇÃO (só sócio — a RLS também barra a escrita de vendedor)
// Tudo o que o motor lê de sv_lpjehh_variaveis: trocar texto, prompt,
// número ou preço mínimo é salvar aqui, sem deploy.
// ============================================================
// Sim/não = variável de texto cujo valor salvo é "sim" ou "nao" (ou
// vazio, num nome *_ligado/*_ligada). Detectado pelo valor para que
// interruptor novo apareça como botão sem mexer aqui.
function ehSimNao(v){
  if(v.tipo==='numero')return false;
  const t=String(v.valor_texto??'').trim().toLowerCase();
  return t==='sim'||t==='nao'||t==='não'||(t===''&&/_ligad[oa]$/.test(v.chave));
}
async function pageConfig(){
  marcarNav('config');
  const{data,error}=await sb.from('sv_lpjehh_variaveis').select('*').order('chave');
  if(falhou(error,'carregar configuração'))return;
  $('pc').innerHTML='<div class="cab"><h2>Configuração</h2></div>'+
    '<div class="sec" style="max-width:860px"><p class="mini" style="margin-bottom:12px">Mudanças valem para o motor em até 5 minutos. Segredos (chaves de API, certificado) não ficam aqui.</p>'+
    (data||[]).map(v=>{
      // Variável sim/não vira interruptor: um clique liga, outro desliga,
      // e salva na hora. Antes era texto livre, e "Sim " ou "s" digitado
      // desligava a função sem aviso (o motor só aceita exatamente "sim").
      if(ehSimNao(v)){
        const on=String(v.valor_texto??'').trim().toLowerCase()==='sim';
        return '<div class="f"><label>'+esc(v.rotulo||v.chave)+' <span class="mini">('+esc(v.chave)+')</span></label>'+
          '<button type="button" class="sw'+(on?' on':'')+'" data-sw="'+esc(v.chave)+'"><span class="tr"></span><span class="lb">'+(on?'Ligado':'Desligado')+'</span></button>'+
          (v.descricao?'<div class="mini">'+esc(v.descricao)+'</div>':'')+'</div>';
      }
      const longo=v.chave==='agente_prompt'||v.chave==='abertura_variantes';
      const val=v.tipo==='numero'?(v.valor_numero??''):(v.valor_texto??'');
      return '<div class="f"><label>'+esc(v.rotulo||v.chave)+' <span class="mini">('+esc(v.chave)+')</span></label>'+
        (longo?'<textarea data-k="'+esc(v.chave)+'" data-t="'+esc(v.tipo)+'" style="min-height:'+(v.chave==='agente_prompt'?'360':'140')+'px;font-family:ui-monospace,monospace;font-size:12px">'+esc(val)+'</textarea>'
              :'<input data-k="'+esc(v.chave)+'" data-t="'+esc(v.tipo)+'" value="'+esc(val)+'"/>')+
        (v.descricao?'<div class="mini">'+esc(v.descricao)+'</div>':'')+'</div>';
    }).join('')+
    '<button class="btn pri" id="cfg-salvar">Salvar tudo</button></div>';
  document.querySelectorAll('[data-sw]').forEach(b=>b.onclick=async()=>{
    const k=b.dataset.sw,ligar=!b.classList.contains('on');
    // motor_ligado é o interruptor geral: ligar sem prompt faria o agente
    // responder clientes sem instrução nenhuma. Confere o prompt SALVO,
    // que é o que o motor lê, não o que está digitado na tela.
    if(k==='motor_ligado'&&ligar){
      const pr=(data||[]).find(x=>x.chave==='agente_prompt');
      if(!pr||!String(pr.valor_texto??'').trim()){toast('Salve o prompt do agente antes de ligar o motor.',5000);return;}
      if(!confirm('Ligar o motor faz o agente começar a responder clientes de verdade. Confirmar?'))return;
    }
    b.disabled=true;
    const r=await sb.from('sv_lpjehh_variaveis').update({valor_texto:ligar?'sim':'nao',atualizado_em:new Date().toISOString()}).eq('chave',k);
    b.disabled=false;
    if(falhou(r.error,'salvar '+k))return;
    const v=(data||[]).find(x=>x.chave===k);if(v)v.valor_texto=ligar?'sim':'nao';
    b.classList.toggle('on',ligar);b.querySelector('.lb').textContent=ligar?'Ligado':'Desligado';
    toast((v?.rotulo||k)+(ligar?' ligado.':' desligado.'));
  });
  $('cfg-salvar').onclick=async()=>{
    const campos=[...document.querySelectorAll('[data-k]')];
    const mudados=campos.filter(el=>{
      const v=(data||[]).find(x=>x.chave===el.dataset.k);
      const orig=el.dataset.t==='numero'?String(v.valor_numero??''):(v.valor_texto??'');
      return el.value!==orig;
    });
    if(!mudados.length){toast('Nada mudou.');return;}
    // motor_ligado é o interruptor geral: ligar sem prompt faria o agente
    // responder clientes sem instrução nenhuma.
    const lig=mudados.find(el=>el.dataset.k==='motor_ligado');
    if(lig&&lig.value.trim().toLowerCase()==='sim'){
      const pr=document.querySelector('[data-k=agente_prompt]');
      if(!pr||!pr.value.trim()){toast('Preencha o prompt do agente antes de ligar o motor.',5000);return;}
      if(!confirm('Ligar o motor faz o agente começar a responder clientes de verdade. Confirmar?'))return;
    }
    for(const el of mudados){
      const up=el.dataset.t==='numero'?{valor_numero:numOuNull(el.value),atualizado_em:new Date().toISOString()}:{valor_texto:el.value.trim()===''?null:el.value,atualizado_em:new Date().toISOString()};
      const r=await sb.from('sv_lpjehh_variaveis').update(up).eq('chave',el.dataset.k);
      if(falhou(r.error,'salvar '+el.dataset.k))return;
    }
    toast(mudados.length+' configuração(ões) salva(s).');pageConfig();
  };
}

// ============================================================
// AGENDA DE CALLS (app) — mesmo desenho da agenda do Diligências:
// calendário do mês com "Ver agenda de", modal do dia e bloqueios.
//
// A REGRA DE HORÁRIO LIVRE NÃO ESTÁ AQUI. Janela (seg a sex, 9h–12h e
// 14h–18h, horários de 1 hora), bloqueios e calls marcadas são
// conferidos pela função sv_lpjehh_horarios_livres
// (_sql/sv_lpjehh_10_agenda.sql). O motor da Vanessa pergunta para a
// mesma função: uma segunda cópia da janela aqui no JS divergiria na
// primeira mudança de horário.
//
// Bloqueio = o que impede a Vanessa de marcar. Quem não vai atender,
// bloqueia (inclusive feriado: a função não conhece feriados).
// ============================================================
const AG_MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const AG_DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const AG_CAD='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const AG_ST={marcada:'Marcada',realizada:'Realizada',cancelada:'Cancelada',faltou:'Cliente faltou'};
// Estado da tela. perfil '' = todos.
let AG={mes:null,perfil:'',pessoas:[],calls:[],bloqs:[],dia:null,editBloq:null,slot:null};

function agISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function agHora(iso){const d=new Date(iso);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function agNome(uid){return AG.pessoas.find(p=>p.id===uid)?.nome||'—';}
function agPeriodo(b){return(!b.horario_inicio&&!b.horario_fim)?'Dia inteiro':(b.horario_inicio||'00:00').slice(0,5)+' – '+(b.horario_fim||'24:00').slice(0,5);}
function agDoPerfil(lista){return AG.perfil?lista.filter(x=>x.usuario_id===AG.perfil):lista;}
function agDataLonga(iso){const d=new Date(iso+'T12:00:00');return AG_DIAS[d.getDay()]+', '+d.getDate()+' de '+AG_MESES[d.getMonth()].toLowerCase()+' de '+d.getFullYear();}

      '</div>'+
      '<label class="mini" style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><input type="checkbox" id="bl-dia"/> Bloquear o dia inteiro</label>'+

  $('bl-cancelar').onclick=agLimparBloq;

async function agMudaMes(delta){
  AG.mes=new Date(AG.mes.getFullYear(),AG.mes.getMonth()+delta,1);
  await agCarregar();
}

// Mês inteiro de calls e bloqueios, mais os próximos bloqueios para a
// lista. Um mês de calls é bem menos que as 1000 linhas do PostgREST;
// o limit fica explícito para não cortar em silêncio se um dia passar.
async function agCarregar(){
  const ini=AG.mes,fim=new Date(AG.mes.getFullYear(),AG.mes.getMonth()+1,1);
  const[c,b,p]=await Promise.all([
    sb.from('sv_lpjehh_calls').select('id,cliente_id,usuario_id,inicio,fim,status,origem,observacao,sv_lpjehh_clientes(nome)').gte('inicio',ini.toISOString()).lt('inicio',fim.toISOString()).order('inicio').limit(1000),
    sb.from('sv_lpjehh_bloqueios').select('*').gte('data',agISO(ini)).lt('data',agISO(fim)).order('data').limit(1000),
    sb.from('sv_lpjehh_bloqueios').select('*').gte('data',agISO(new Date())).order('data').order('horario_inicio').limit(200)
  ]);
  if(falhou(c.error,'carregar as calls')||falhou(b.error,'carregar os bloqueios')||falhou(p.error,'carregar os bloqueios'))return;
  AG.calls=c.data||[];AG.bloqs=b.data||[];AG.prox=p.data||[];
  agRender();agRenderBloqLista();
  if(AG.dia)agRenderDia();
}

function agRender(){
  if(!$('ag-grid'))return;
  $('ag-mes').textContent=AG_MESES[AG.mes.getMonth()]+' '+AG.mes.getFullYear();
  const ano=AG.mes.getFullYear(),mes=AG.mes.getMonth();
  const dias=new Date(ano,mes+1,0).getDate(),primeiro=new Date(ano,mes,1).getDay();
  const hoje=agISO(new Date());
  const qt={},blq={};
  // Cancelada não conta: o dia fica com cara de livre, que é o que é.
  agDoPerfil(AG.calls).filter(x=>x.status!=='cancelada').forEach(x=>{const k=agISO(new Date(x.inicio));qt[k]=(qt[k]||0)+1;});
  agDoPerfil(AG.bloqs).forEach(x=>blq[x.data]=true);
  let h=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>'<div class="ag-sem">'+d+'</div>').join('');
  for(let i=0;i<primeiro;i++)h+='<div class="ag-cel vazia"></div>';
  for(let d=1;d<=dias;d++){
    const iso=ano+'-'+String(mes+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const sem=new Date(ano,mes,d).getDay();
    let cls='ag-cel';
    if(sem===0||sem===6)cls+=' fds';
    if(iso===hoje)cls+=' hoje';else if(iso<hoje)cls+=' passado';
    let bd='';
    if(qt[iso])bd+='<span class="ag-call">'+qt[iso]+'</span>';
    if(blq[iso])bd+='<span class="ag-cad">'+AG_CAD+'</span>';
    h+='<div class="'+cls+'" data-dia="'+iso+'"><div class="ag-num">'+d+'</div>'+(bd?'<div class="ag-bdg">'+bd+'</div>':'')+'</div>';
  }
  $('ag-grid').innerHTML=h;
  $('ag-grid').querySelectorAll('[data-dia]').forEach(el=>el.onclick=()=>agAbrirDia(el.dataset.dia));
}

// ---------- modal do dia ----------
function agAbrirDia(iso){
  AG.dia=iso;AG.slot=null;
  if(!$('ag-modal')){
    document.body.insertAdjacentHTML('beforeend','<div id="ag-modal" class="h"><div id="ag-box"></div></div>');
    $('ag-modal').onclick=e=>{if(e.target.id==='ag-modal')agFecharDia();};
  }
  $('ag-modal').classList.remove('h');
  agRenderDia();
}
function agFecharDia(){AG.dia=null;AG.slot=null;$('ag-modal')?.classList.add('h');}
async function agNavDia(delta){
  const d=new Date(AG.dia+'T12:00:00');d.setDate(d.getDate()+delta);
  AG.dia=agISO(d);AG.slot=null;
  // Passou para outro mês: recarrega o mês, senão o modal mostraria
  // o dia vazio (as calls daquele mês não estão em memória).
  if(d.getMonth()!==AG.mes.getMonth()||d.getFullYear()!==AG.mes.getFullYear()){AG.mes=new Date(d.getFullYear(),d.getMonth(),1);await agCarregar();}
  else agRenderDia();
}

async function agRenderDia(){
  const iso=AG.dia;if(!iso)return;
  const bl=agDoPerfil(AG.bloqs).filter(b=>b.data===iso);
  const cs=agDoPerfil(AG.calls).filter(c=>agISO(new Date(c.inicio))===iso).sort((a,b)=>a.inicio.localeCompare(b.inicio));
  let h='<div class="ag-mh"><button class="btn sm" id="agd-ant">‹</button><h3>'+esc(agDataLonga(iso))+'</h3><button class="btn sm" id="agd-prox">›</button><button class="btn sm" id="agd-x" title="Fechar">✕</button></div>';
  h+=bl.map(b=>'<div class="ag-blq"><span class="ag-cad">'+AG_CAD+'</span><div class="grow"><b>'+esc(agNome(b.usuario_id))+'</b> indisponível — '+agPeriodo(b)+(b.motivo?' ('+esc(b.motivo)+')':'')+'</div>'+
    '<button class="btn sm" data-ebl="'+b.id+'">Editar</button><button class="btn sm red" data-rbl="'+b.id+'">Remover</button></div>').join('');
  h+='<div class="sec"><h4>Calls ('+cs.length+')</h4>'+(cs.length?cs.map(c=>
    '<div class="lin" style="flex-wrap:wrap"><div style="flex:1 1 200px;min-width:0"><b>'+agHora(c.inicio)+'</b> · <span class="click" data-card="'+(c.cliente_id||'')+'" style="cursor:pointer;text-decoration:underline">'+esc(c.sv_lpjehh_clientes?.nome||'sem cliente')+'</span>'+
      '<div class="mini">com '+esc(agNome(c.usuario_id))+' · '+(c.origem==='vanessa'?'marcada pela Vanessa':'marcada no CRM')+'</div></div>'+
      '<span class="tag st-'+c.status+'">'+AG_ST[c.status]+'</span>'+
      (c.status==='marcada'?'<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" data-st="realizada" data-call="'+c.id+'">Realizada</button><button class="btn sm" data-st="faltou" data-call="'+c.id+'">Faltou</button><button class="btn sm red" data-st="cancelada" data-call="'+c.id+'">Cancelar</button></div>':'')+
    '</div>').join(''):'<div class="mini">Nenhuma call neste dia.</div>')+'</div>';
  h+='<div class="sec"><h4>Horários livres</h4><div id="agd-livres" class="mini">Carregando…</div><div id="agd-marcar"></div></div>';
  h+='<button class="btn" style="width:100%" id="agd-bloq">+ Bloquear horário neste dia</button>';
  $('ag-box').innerHTML=h;
  $('agd-ant').onclick=()=>agNavDia(-1);$('agd-prox').onclick=()=>agNavDia(1);$('agd-x').onclick=agFecharDia;
  $('agd-bloq').onclick=()=>{agLimparBloq();$('bl-data').value=iso;if(AG.perfil)$('bl-quem').value=AG.perfil;agFecharDia();$('bl-form').scrollIntoView({behavior:'smooth'});};
  $('ag-box').querySelectorAll('[data-ebl]').forEach(b=>b.onclick=()=>{agEditarBloq(b.dataset.ebl);agFecharDia();});
  $('ag-box').querySelectorAll('[data-rbl]').forEach(b=>b.onclick=()=>agRemoverBloq(b.dataset.rbl));
  $('ag-box').querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>agStatusCall(b.dataset.call,b.dataset.st));
  $('ag-box').querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{if(!b.dataset.card)return;agFecharDia();abrirCard(b.dataset.card);});
  // Horários livres pela mesma função do motor, sem antecedência: aqui
  // é o sócio marcando, ele sabe se dá tempo.
  const de=new Date(iso+'T00:00:00'),ate=new Date(iso+'T23:59:59');
  const{data,error}=await sb.rpc('sv_lpjehh_horarios_livres',{p_de:de.toISOString(),p_ate:ate.toISOString(),p_antecedencia:'0 hours'});
  if(AG.dia!==iso||!$('agd-livres'))return; // trocou de dia enquanto carregava
  if(error){$('agd-livres').textContent='Erro ao ler os horários: '+error.message;return;}
  const porHora={};
  (data||[]).filter(x=>!AG.perfil||x.usuario_id===AG.perfil).forEach(x=>{(porHora[x.inicio]=porHora[x.inicio]||[]).push(x);});
  const hs=Object.keys(porHora).sort();
  if(!hs.length){$('agd-livres').textContent='Nenhum horário livre (passou, é fim de semana, ou está tudo bloqueado/ocupado).';return;}
  $('agd-livres').innerHTML='<div class="ag-livres">'+hs.map(k=>'<button data-slot="'+k+'" title="Livre: '+esc(porHora[k].map(x=>x.usuario_nome).join(', '))+'">'+agHora(k)+'</button>').join('')+'</div><div class="mini" style="margin-top:6px">Toque num horário para marcar uma call manual.</div>';
  $('agd-livres').querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{AG.slot=b.dataset.slot;$('agd-livres').querySelectorAll('[data-slot]').forEach(x=>x.classList.toggle('on',x===b));agFormMarcar(porHora[b.dataset.slot]);});
}

// ---------- call manual ----------
function agFormMarcar(livres){
  $('agd-marcar').innerHTML='<div style="margin-top:12px">'+
    '<div class="f"><label>Cliente *</label><input id="agm-busca" placeholder="Digite o nome do cliente"/><select id="agm-cli" size="4" style="margin-top:4px"></select></div>'+
    '<div class="f"><label>Com quem</label><select id="agm-quem"><option value="">Quem estiver livre</option>'+livres.map(x=>'<option value="'+x.usuario_id+'">'+esc(x.usuario_nome)+'</option>').join('')+'</select></div>'+
    '<button class="btn pri" id="agm-ok">Marcar call às '+agHora(AG.slot)+'</button></div>';
  let t=null;
  $('agm-busca').oninput=e=>{clearTimeout(t);t=setTimeout(()=>agBuscarCliente(e.target.value.trim()),300);};
  $('agm-ok').onclick=agMarcarManual;
}
async function agBuscarCliente(txt){
  if(txt.length<2){$('agm-cli').innerHTML='';return;}
  const{data,error}=await sb.from('sv_lpjehh_clientes').select('id,nome,telefone_chave').ilike('nome','%'+txt.replace(/[%_]/g,'')+'%').order('nome').limit(20);
  if(falhou(error,'buscar cliente'))return;
  $('agm-cli').innerHTML=(data||[]).map(c=>'<option value="'+c.id+'">'+esc(c.nome||'sem nome')+(c.telefone_chave?' · final '+esc(String(c.telefone_chave).slice(-4)):'')+'</option>').join('');
  if(data&&data.length===1)$('agm-cli').value=data[0].id;
}
async function agMarcarManual(){
  const cli=$('agm-cli').value;
  if(!cli){toast('Escolha o cliente na lista.');return;}
  $('agm-ok').disabled=true;
  const{data,error}=await sb.rpc('sv_lpjehh_marcar_call',{p_cliente:cli,p_inicio:AG.slot,p_origem:'manual',p_usuario:$('agm-quem').value||null,p_criado_por:U.id});
  $('agm-ok').disabled=false;
  if(falhou(error,'marcar a call'))return;
  if(!data||!data.id){toast('Esse horário não está mais livre. Escolha outro.',4000);agRenderDia();return;}
  await agMarcaNoCliente(cli,data.inicio);
  await sb.from('sv_lpjehh_atividades').insert({cliente_id:cli,tipo:'agenda',descricao:'Call marcada no CRM por '+U.nome+' para '+dataHora(data.inicio)+' com '+agNome(data.usuario_id)+'.'});
  toast('Call marcada. Avise o cliente pela conversa.',4000);
  await agCarregar();
}
// call_marcada no card faz a Vanessa parar de oferecer horário a quem
// já tem call; call_pedida para o follow-up "fu_call". Cancelar limpa
// call_marcada, para ela voltar a oferecer se ele quiser remarcar.
async function agMarcaNoCliente(cli,inicio){
  const{data}=await sb.from('sv_lpjehh_clientes').select('agente_dados').eq('id',cli).limit(1);
  const d=Object.assign({},data?.[0]?.agente_dados||{});
  if(inicio){d.call_marcada=inicio;d.call_pedida=true;}else delete d.call_marcada;
  const r=await sb.from('sv_lpjehh_clientes').update({agente_dados:d}).eq('id',cli);
  falhou(r.error,'atualizar o card do cliente');
}
async function agStatusCall(id,st){
  const c=AG.calls.find(x=>x.id===id);if(!c)return;
  if(st==='cancelada'&&!confirm('Cancelar a call de '+(c.sv_lpjehh_clientes?.nome||'sem cliente')+' às '+agHora(c.inicio)+'? O horário fica livre de novo. O cliente NÃO é avisado sozinho.'))return;
  const r=await sb.from('sv_lpjehh_calls').update({status:st}).eq('id',id);
  if(falhou(r.error,'atualizar a call'))return;
  if(c.cliente_id){
    if(st==='cancelada')await agMarcaNoCliente(c.cliente_id,null);
    await sb.from('sv_lpjehh_atividades').insert({cliente_id:c.cliente_id,tipo:'agenda',descricao:'Call de '+dataHora(c.inicio)+': '+AG_ST[st].toLowerCase()+' ('+U.nome+').'});
  }
  toast(st==='cancelada'?'Call cancelada. Avise o cliente pela conversa.':'Call marcada como '+AG_ST[st].toLowerCase()+'.',4000);
  await agCarregar();
}

// ---------- bloqueios ----------
function agToggleDia(){
  const on=$('bl-dia').checked;
  $('bl-ini').disabled=on;$('bl-fim').disabled=on;
  if(on){$('bl-ini').value='';$('bl-fim').value='';}
}
function agLimparBloq(){
  if(!$('bl-data'))return;
  AG.editBloq=null;
  ['bl-data','bl-ini','bl-fim','bl-mot'].forEach(i=>$(i).value='');
  $('bl-dia').checked=false;agToggleDia();
  $('bl-tit').textContent='Novo bloqueio';$('bl-salvar').textContent='+ Adicionar bloqueio';$('bl-cancelar').classList.add('h');
}
function agEditarBloq(id){
  const b=[...AG.bloqs,...(AG.prox||[])].find(x=>x.id===id);if(!b)return;
  AG.editBloq=id;
  $('bl-quem').value=b.usuario_id;$('bl-data').value=b.data;$('bl-mot').value=b.motivo||'';
  $('bl-dia').checked=!b.horario_inicio&&!b.horario_fim;agToggleDia();
  $('bl-ini').value=(b.horario_inicio||'').slice(0,5);$('bl-fim').value=(b.horario_fim||'').slice(0,5);
  $('bl-tit').textContent='Editar bloqueio';$('bl-salvar').textContent='Salvar alterações';$('bl-cancelar').classList.remove('h');
  $('bl-form').scrollIntoView({behavior:'smooth'});
}
async function agSalvarBloq(){
  const quem=$('bl-quem').value,data=$('bl-data').value,dia=$('bl-dia').checked;
  const ini=dia?null:($('bl-ini').value||null),fim=dia?null:($('bl-fim').value||null);
  if(!quem){toast('Escolha quem fica indisponível.');return;}
  if(!data){toast('Informe a data.');return;}
  if(ini&&fim&&fim<=ini){toast('O fim tem que ser depois do início.');return;}
  // Call já marcada no período: avisa, igual ao Diligências. Bloquear
  // NÃO desmarca a call — quem bloqueou decide se cancela.
  const di=new Date(data+'T'+(ini||'00:00')+':00'),df=fim?new Date(data+'T'+fim+':00'):new Date(new Date(data+'T00:00:00').getTime()+86400000);
  const{data:ch,error:erroCh}=await sb.from('sv_lpjehh_calls').select('inicio,sv_lpjehh_clientes(nome)').eq('usuario_id',quem).eq('status','marcada').lt('inicio',df.toISOString()).gt('fim',di.toISOString()).limit(20);
  if(falhou(erroCh,'conferir as calls'))return;
  if(ch&&ch.length&&!confirm(agNome(quem)+' já tem call marcada nesse período:\n'+ch.map(c=>'• '+agHora(c.inicio)+' — '+(c.sv_lpjehh_clientes?.nome||'sem cliente')).join('\n')+'\n\nBloquear mesmo assim? A call NÃO é desmarcada.'))return;
  const reg={usuario_id:quem,data,horario_inicio:ini,horario_fim:fim,motivo:$('bl-mot').value.trim()||null};
  const r=AG.editBloq?await sb.from('sv_lpjehh_bloqueios').update(reg).eq('id',AG.editBloq):await sb.from('sv_lpjehh_bloqueios').insert({...reg,criado_por:U.id});
  if(falhou(r.error,'salvar o bloqueio'))return;
  toast(AG.editBloq?'Bloqueio atualizado.':'Bloqueio adicionado.');
  agLimparBloq();await agCarregar();
}
async function agRemoverBloq(id){
  if(!confirm('Remover este bloqueio? O horário volta a ficar livre para a Vanessa marcar.'))return;
  const r=await sb.from('sv_lpjehh_bloqueios').delete().eq('id',id);
  if(falhou(r.error,'remover o bloqueio'))return;
  toast('Bloqueio removido.');await agCarregar();
}
function agRenderBloqLista(){
  if(!$('bl-lista'))return;
  const l=agDoPerfil(AG.prox||[]);
  $('bl-lista').innerHTML=l.length?l.map(b=>'<div class="tr"><div class="grow"><b>'+esc(agNome(b.usuario_id))+' · '+dataBR(b.data)+' · '+agPeriodo(b)+'</b>'+(b.motivo?'<div class="mini">'+esc(b.motivo)+'</div>':'')+'</div>'+
    '<button class="btn sm" data-ebl="'+b.id+'">Editar</button><button class="btn sm red" data-rbl="'+b.id+'">Remover</button></div>').join(''):'<div class="emp">Nenhum bloqueio daqui para frente.</div>';
  $('bl-lista').querySelectorAll('[data-ebl]').forEach(b=>b.onclick=()=>agEditarBloq(b.dataset.ebl));
  $('bl-lista').querySelectorAll('[data-rbl]').forEach(b=>b.onclick=()=>agRemoverBloq(b.dataset.rbl));
}

sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){U=null;mostrarLogin();}});
iniciar();
</script>
